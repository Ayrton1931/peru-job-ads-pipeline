x-mssql-password: &mssql_password ${MSSQL_SA_PASSWORD:-JobAds#Local2024}

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    environment:
      CLUSTER_NAME: jobads
    env_file: docker/hadoop.env
    ports:
      - "9870:9870"   # HDFS web UI
    volumes:
      - namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file: docker/hadoop.env
    volumes:
      - datanode:/hadoop/dfs/data
    depends_on:
      - namenode

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    hostname: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: *mssql_password
    ports:
      - "1433:1433"
    volumes:
      - mssql:/var/opt/mssql

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-only
      PYTHONPATH: /opt/project/src:/opt/project/spark_jobs
      LAKE_ROOT: hdfs://namenode:9000/lake
      RAW_ZIP_DIR: /opt/project/data/raw
      RAW_DIR: /tmp/raw_extracted
      SEEDS_DIR: /opt/project/seeds
      SQL_DIR: /opt/project/sql
      MSSQL_HOST: sqlserver
      MSSQL_USER: sa
      MSSQL_PASSWORD: *mssql_password
      MSSQL_DB: jobads
    volumes:
      - ./:/opt/project:ro
    ports:
      - "8080:8080"   # Airflow web UI
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true) &&
               (airflow scheduler &) &&
               exec airflow webserver"
    depends_on:
      - namenode
      - datanode
      - sqlserver

networks:
  default:
    driver_opts:
      # fixed bridge name so .devcontainer/allow-compose-bridge.sh can allow it in the firewall
      com.docker.network.bridge.name: jobads0

volumes:
  namenode:
  datanode:
  mssql:
